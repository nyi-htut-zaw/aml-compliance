version: "3.9"

# ════════════════════════════════════════════════════════════════════════════
# AML Compliance & Financial Crime Platform — Docker Compose
# ════════════════════════════════════════════════════════════════════════════
# DISCLAIMER: Demo platform only. Not for production regulatory use without
# validation by qualified compliance and legal professionals.
# ════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aml_compliance
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aml_compliance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aml-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:       postgres
      DB_PORT:       5432
      DB_NAME:       aml_compliance
      DB_USER:       postgres
      DB_PASSWORD:   admin
      JWT_SECRET:    404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      PORT:          8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Angular Frontend (nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aml-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pg_data:
    driver: local
